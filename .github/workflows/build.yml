name: Build APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install fpcalc (reference chromaprint implementation)
        run: |
          sudo apt-get update
          sudo apt-get install -y libchromaprint-tools || echo "fpcalc unavailable"
          if command -v fpcalc >/dev/null; then
            fpcalc -raw -algorithm 2 -length 120 fp/src/test/resources/test_mono_11025.raw > /tmp/expected.txt || true
            cat /tmp/expected.txt || true
          fi

      - name: Fingerprint unit tests (compared against fpcalc)
        env:
          FP_EXPECTED_RAW_FILE: /tmp/expected.txt
        run: gradle :fp:test --stacktrace --info

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Show APK
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotag-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint/test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            fp/build/reports/**
          if-no-files-found: ignore

      - name: Publish rolling release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AutoTag APK (latest)
          body: |
            최신 빌드에서 생성된 디버그 APK 입니다.
            설치: `adb install -r app-debug.apk` 또는 파일 관리자에서 APK 실행.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: "false"
